name: Run tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run affected tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Node.JS and pnpm
        uses: ./.github/actions/prepare-nodejs-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run affected tests
        run: pnpm test
